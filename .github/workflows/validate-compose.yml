name: Validate Compose and shell
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        env:
          LRTMP2_API_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SECRET_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          PANEL_PASSWORD: validation-only-password
        run: docker compose config --quiet
      - name: Read pinned panel revision
        id: panel
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          ref = next(line.split('=', 1)[1] for line in Path('Dockerfile').read_text().splitlines() if line.startswith('ARG PANEL_REF='))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ref={ref}\n')
          PY
      - name: Check out pinned upstream startup configuration
        uses: actions/checkout@v7
        with:
          repository: OpenRTMP/librtmp2-server-panel
          ref: ${{ steps.panel.outputs.ref }}
          path: .upstream
          persist-credentials: false
      - name: Test rendered settings against upstream startup validation
        env:
          PANEL_SOURCE_DIR: ${{ github.workspace }}/.upstream
        run: |
          sh -n entrypoint.sh
          python3 -m unittest discover -s tests -v
