services:
  rtmppanel:
    image: alexanderwagnerdev/rtmppanel:latest
    container_name: rtmppanel
    restart: unless-stopped
    environment:
      - LANG=en
      - TZ=UTC
      - LRTMP2_API_URL=http://librtmp2-server:8080
      - LRTMP2_API_TOKEN=your-api-token
      - LRTMP2_DOMAIN=your-rtmp-domain-or-ip
      - LRTMP2_RTMP_PORT=1935
      - LRTMP2_APP=live
      - REQUIRE_LOGIN=True
      - USERNAME=admin
      - PASSWORD=password
      - SECRET_KEY=change-me-random-secret-key
      - PANEL_DB_PATH=/data/panel.db
      # Optional: set to True only when the panel is served over HTTPS
      # - SESSION_COOKIE_SECURE=False
    volumes:
      - rtmppanel-data:/data
    ports:
      - "8000:8000/tcp"

volumes:
  rtmppanel-data:
